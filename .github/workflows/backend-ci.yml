name: backend-ci

on:
  push:
    paths: ["vanmitra_backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["vanmitra_backend/**", ".github/workflows/backend-ci.yml"]

defaults:
  run:
    working-directory: vanmitra_backend

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vanmitra_backend/requirements*.txt

      # Core + dev only: the legacy AI stack (PyTorch) is not needed to test the claim API.
      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check app tests scripts
          ruff format --check app tests scripts

      - name: Type check
        run: mypy app scripts

      # A throwaway MongoDB on the CI machine, as a one-member replica set so that
      # transactions work (as on MongoDB Atlas).
      - name: MongoDB for the database tests
        working-directory: .
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval "db.adminCommand('ping').ok" && break; sleep 2; done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})"
          for i in $(seq 1 30); do [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break; sleep 2; done

      - name: Tests (including database tests)
        env:
          VANMITRA_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
        run: pytest -q
