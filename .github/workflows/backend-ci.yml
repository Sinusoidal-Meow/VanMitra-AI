name: backend-ci

on:
  push:
    paths: ["vanmitra_backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["vanmitra_backend/**", ".github/workflows/backend-ci.yml"]

defaults:
  run:
    working-directory: vanmitra_backend

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vanmitra_backend/requirements*.txt

      # Core + dev only: the legacy AI stack (PyTorch) is not needed to test the claim API.
      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check app tests scripts
          ruff format --check app tests scripts

      - name: Type check
        run: mypy app scripts

      - name: Tests
        run: pytest -q
